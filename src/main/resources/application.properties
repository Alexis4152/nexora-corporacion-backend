# =====================================================================================
# Nexora Corporación — configuración técnica común. Secretos SOLO por variables de entorno (.env.example).
# La configuración de negocio (impuestos, gracia, alertas, plantillas, colores) vive en PostgreSQL.
# =====================================================================================
spring.application.name=nexora-corporacion-backend
spring.profiles.default=dev
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexora_corporacion}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:12}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8091}
server.forward-headers-strategy=native
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=14MB

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=alpha

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5181}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5181}
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.access-ttl=${APP_JWT_ACCESS_TTL:PT15M}
app.jwt.refresh-ttl=${APP_JWT_REFRESH_TTL:PT10H}
app.cookie.secure=${APP_COOKIE_SECURE:false}
app.cookie.same-site=${APP_COOKIE_SAMESITE:Strict}
app.encryption.key=${APP_ENCRYPTION_KEY:}
app.storage.dir=${APP_STORAGE_DIR:./data/storage}
app.storage.max-bytes=${APP_STORAGE_MAX_BYTES:10485760}

app.security.rate-limit-enabled=${APP_RATE_LIMIT_ENABLED:true}
app.security.max-failed-logins=${APP_MAX_FAILED_LOGINS:5}
app.security.lock-duration=${APP_LOCK_DURATION:PT15M}
app.security.reset-token-ttl=${APP_RESET_TOKEN_TTL:PT30M}
app.security.reauth-window=${APP_REAUTH_WINDOW:PT10M}
app.security.jobs-enabled=${APP_JOBS_ENABLED:true}

app.bootstrap.super-admin-email=${APP_BOOTSTRAP_SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin-password=${APP_BOOTSTRAP_SUPER_ADMIN_PASSWORD:}
app.bootstrap.demo-data=${APP_DEMO_DATA:false}
app.bootstrap.demo-password=${APP_DEMO_PASSWORD:}

logging.level.root=INFO
logging.level.com.nexora.corp=INFO
